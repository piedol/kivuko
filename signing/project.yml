# A stub Xcode project whose only job is development signing: building it with
# -allowProvisioningUpdates makes Xcode register this Mac and the two bundle IDs in the
# developer account and download development provisioning profiles. scripts/bundle.sh then
# signs the real (Rust) app with those profiles. Regenerate with: xcodegen -s signing/project.yml
name: KivukoSigning
options:
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ABCDE12345
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Kivuko:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - target: KivukoTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.piedol.kivuko
        PRODUCT_NAME: Kivuko
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
  KivukoTunnel:
    type: app-extension
    platform: macOS
    sources: [Tunnel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.piedol.kivuko.tunnel
        PRODUCT_NAME: KivukoTunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
