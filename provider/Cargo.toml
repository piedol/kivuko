[package]
name = "provider"
description = "The packet-tunnel provider: picks a Nord server and runs WireGuard (GotaTun) on the utun macOS creates"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "provider"
path = "src/main.rs"

[features]
# The Developer ID release: run as a system extension instead of an app extension.
sysext = ["dep:dispatch2"]

[dependencies]
nord.workspace = true
shared.workspace = true
gotatun = { version = "0.10.2", default-features = false, features = ["device", "ring"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
ipnetwork = "0.21.1"
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
log.workspace = true
oslog.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-network-extension.workspace = true
block2.workspace = true
dispatch2 = { workspace = true, optional = true }

[dev-dependencies]
bytes = "1"
