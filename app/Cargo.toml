[package]
name = "app"
description = "Kivuko's menu-bar app: sets up the VPN, connects, and shows status"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "Kivuko"
path = "src/main.rs"

[features]
# The Developer ID release: the tunnel is a system extension, which the app asks macOS to
# activate at launch. Without it, the tunnel is an app extension (development signing).
sysext = ["dep:objc2-system-extensions"]

[dependencies]
nord.workspace = true
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
oslog.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-network-extension.workspace = true
objc2-service-management.workspace = true
objc2-system-extensions = { workspace = true, optional = true }
objc2-user-notifications.workspace = true
block2.workspace = true
dispatch2.workspace = true
security-framework = "3.7"
